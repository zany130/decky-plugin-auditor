name: Package Validation

on:
  pull_request:
    paths:
      - LICENSE
      - NOTICE
      - README.md
      - audit_plugins.py
      - consumer_configuration.py
      - decky_audit_cli.py
      - examples/**
      - packaged_resources.py
      - semgrep_source_scanning.py
      - semgrep-rules.yml
      - pyproject.toml
      - uv.lock
      - scripts/compare_audit_reports.py
      - tests/**
      - .github/workflows/package-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "package-validation-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  package:
    name: Build and external consumer parity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Validate committed lockfile
        run: uv lock --check

      - name: Build source and wheel distributions
        run: uv build

      - name: Verify Apache-2.0 package metadata and notices
        run: |
          python - <<'PYEOF'
          import glob
          import tarfile
          import zipfile
          from pathlib import PurePosixPath

          wheels = glob.glob("dist/*.whl")
          sdists = glob.glob("dist/*.tar.gz")
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(
                  f"Expected exactly one wheel and one sdist; wheels={wheels}, sdists={sdists}"
              )

          required_files = {"LICENSE", "NOTICE"}

          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              metadata_names = [
                  name for name in names if name.endswith(".dist-info/METADATA")
              ]
              if len(metadata_names) != 1:
                  raise SystemExit(f"Expected one wheel METADATA file: {metadata_names}")
              metadata = archive.read(metadata_names[0]).decode("utf-8")
              metadata_lines = set(metadata.splitlines())
              if "License-Expression: Apache-2.0" not in metadata_lines:
                  raise SystemExit("Wheel metadata does not declare Apache-2.0")

              license_fields = {
                  line.removeprefix("License-File: ")
                  for line in metadata.splitlines()
                  if line.startswith("License-File: ")
              }
              if not required_files.issubset(license_fields):
                  raise SystemExit(
                      f"Wheel License-File metadata is incomplete: {license_fields}"
                  )

              packaged_notices = {
                  PurePosixPath(name).name
                  for name in names
                  if ".dist-info/licenses/" in name
              }
              if not required_files.issubset(packaged_notices):
                  raise SystemExit(
                      f"Wheel is missing license files: {required_files - packaged_notices}"
                  )

          with tarfile.open(sdists[0], "r:gz") as archive:
              packaged_notices = {
                  PurePosixPath(name).name for name in archive.getnames()
              }
              if not required_files.issubset(packaged_notices):
                  raise SystemExit(
                      f"Source distribution is missing license files: "
                      f"{required_files - packaged_notices}"
                  )

          print("Apache-2.0 metadata and LICENSE/NOTICE packaging verified.")
          PYEOF

      - name: Install wheel into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/package-venv"
          "$RUNNER_TEMP/package-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/package-venv/bin/python" -m pip install dist/*.whl

      - name: Verify installed command, resources, and list requirement
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/package-venv/bin/decky-audit" --help
          "$RUNNER_TEMP/package-venv/bin/python" - <<'PYEOF'
          import os
          import audit_plugins
          import consumer_configuration
          import semgrep_source_scanning

          rules = semgrep_source_scanning._SEMGREP_RULES_FILE
          print(f"Packaged Semgrep rules: {rules}")
          if not os.path.isfile(rules):
              raise SystemExit(f"Packaged Semgrep rules not found: {rules}")
          PYEOF

          set +e
          "$RUNNER_TEMP/package-venv/bin/decky-audit" --all \
            > "$RUNNER_TEMP/missing-plugins-file.log" 2>&1
          status=$?
          set -e
          if [[ "$status" -ne 2 ]]; then
            cat "$RUNNER_TEMP/missing-plugins-file.log"
            echo "ERROR: --all without --plugins-file exited $status instead of 2"
            exit 1
          fi
          grep -q -- "--plugins-file is required" "$RUNNER_TEMP/missing-plugins-file.log"

      - name: Install pinned Semgrep for parity audit
        run: |
          uv tool install --python 3.12 --with setuptools==70.3.0 semgrep==1.132.0
          SEMGREP_BIN_DIR=$(uv tool dir --bin)
          echo "$SEMGREP_BIN_DIR" >> "$GITHUB_PATH"
          export PATH="$SEMGREP_BIN_DIR:$PATH"
          semgrep --version --disable-version-check

      - name: Create external consumer configuration
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          cat > "$RUNNER_TEMP/consumer/plugins.txt" <<'EOF'
          https://github.com/beallio/SDH-Ludusavi
          EOF
          cat > "$RUNNER_TEMP/consumer/policy.yml" <<'YAML'
          version: "1"
          enforcement:
            mode: report-only
          scanners:
            clamav:
              enabled: false
              required: false
            trivy:
              enabled: false
              required: false
            semgrep:
              enabled: true
              required: false
            osv_scanner:
              enabled: false
              required: false
            source_artifact_diff:
              enabled: true
              required: true
          YAML
          cat > "$RUNNER_TEMP/consumer/allowlist.yml" <<'YAML'
          version: "1"
          exceptions: []
          YAML

      - name: Compare legacy script and installed external consumer reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf "$RUNNER_TEMP/legacy-reports" "$RUNNER_TEMP/installed-reports"
          uv run python audit_plugins.py \
            --all \
            --plugins-file "$RUNNER_TEMP/consumer/plugins.txt" \
            --policy "$RUNNER_TEMP/consumer/policy.yml" \
            --allowlist "$RUNNER_TEMP/consumer/allowlist.yml" \
            --output-dir "$RUNNER_TEMP/legacy-reports" \
            --cache-dir "$RUNNER_TEMP/legacy-cache" \
            --skip-cache

          (
            cd "$RUNNER_TEMP/consumer"
            "$RUNNER_TEMP/package-venv/bin/decky-audit" \
              --all \
              --plugins-file "$RUNNER_TEMP/consumer/plugins.txt" \
              --policy "$RUNNER_TEMP/consumer/policy.yml" \
              --allowlist "$RUNNER_TEMP/consumer/allowlist.yml" \
              --output-dir "$RUNNER_TEMP/installed-reports" \
              --cache-dir "$RUNNER_TEMP/installed-cache" \
              --skip-cache
          )

          uv run python scripts/compare_audit_reports.py \
            "$RUNNER_TEMP/legacy-reports" \
            "$RUNNER_TEMP/installed-reports"

      - name: Upload package validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-validation
          path: |
            LICENSE
            NOTICE
            uv.lock
            dist/*
            ${{ runner.temp }}/missing-plugins-file.log
            ${{ runner.temp }}/consumer/*
            ${{ runner.temp }}/legacy-reports/security-report.json
            ${{ runner.temp }}/legacy-reports/security-report.md
            ${{ runner.temp }}/installed-reports/security-report.json
            ${{ runner.temp }}/installed-reports/security-report.md
          retention-days: 30
          if-no-files-found: warn
