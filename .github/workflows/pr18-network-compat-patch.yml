name: PR18 Network Compatibility Patch

on:
  pull_request:
    paths:
      - .github/workflows/pr18-network-compat-patch.yml
      - reviewer_capability_comparison.py
      - tests/test_reviewer_capability_legacy_network_compat.py

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.head_ref == 'agent/fix-empty-structured-network-fallback' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Patch network inventory compatibility
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("reviewer_capability_comparison.py")
          text = path.read_text(encoding="utf-8")
          old = '''def _network_destinations(
              report: object,
              capability: dict[str, Any],
          ) -> set[str]:
              structured = _value(report, "network_destinations", _MISSING)
              if structured is not _MISSING and isinstance(structured, list):
                  return {
                      _safe_text(_value(item, "destination", ""))
                      for item in structured
                      if _value(item, "destination", "")
                  }

              legacy = _value(report, "extracted_domains", _MISSING)
              if legacy is not _MISSING and isinstance(legacy, list):
                  return {_safe_text(value) for value in legacy if value}

              return _capability_network_destinations(capability)
          '''
          new = '''def _network_destinations(
              report: object,
              capability: dict[str, Any],
          ) -> set[str]:
              structured = _value(report, "network_destinations", _MISSING)
              if structured is not _MISSING and isinstance(structured, list):
                  structured_values = {
                      destination
                      for item in structured
                      if (destination := _safe_text(
                          _value(item, "destination", "")
                      ).strip())
                  }
                  if structured_values:
                      return structured_values

              # Cached reports produced before the rich structured inventory was
              # persisted can expose an explicit empty ``network_destinations``
              # list while retaining the complete inventory in
              # ``extracted_domains``. Treat a semantically empty structured list
              # as a compatibility gap, not proof that every destination vanished.
              legacy = _value(report, "extracted_domains", _MISSING)
              if legacy is not _MISSING and isinstance(legacy, list):
                  return {
                      destination
                      for value in legacy
                      if (destination := _safe_text(value).strip())
                  }

              return _capability_network_destinations(capability)
          '''
          if old not in text:
              raise SystemExit("expected _network_destinations block was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Run focused compatibility regressions
        run: |
          set -euo pipefail
          python -m unittest -v tests.test_reviewer_capability_legacy_network_compat

      - name: Commit compatibility fix
        run: |
          set -euo pipefail
          if git diff --quiet -- reviewer_capability_comparison.py; then
            echo "::error::compatibility patch produced no implementation change"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviewer_capability_comparison.py
          git commit -m "fix: preserve legacy cached network inventories"
          git push origin HEAD:${{ github.head_ref }}
