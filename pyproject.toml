[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "decky-plugin-auditor"
version = "0.1.0"
description = "Static security auditing and reviewer evidence for Decky Loader plugins"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "urllib3",
    "PyYAML",
]

[project.scripts]
decky-audit = "decky_audit_cli:main"

# Keep the validated flat module layout installable while the public CLI
# boundary is established. Moving implementation modules into src/decky_audit
# will be a separate behavior-preserving change after consumers use the CLI.
[tool.setuptools]
py-modules = [
    "artifact_diff_filters",
    "audit_noise_filters",
    "audit_plugins",
    "audit_plugins_core",
    "behavior_false_positive_filters",
    "consumer_configuration",
    "credential_exposure_filters",
    "decky_audit_cli",
    "metadata_build_stamp_filters",
    "network_destination_filters",
    "packaged_resources",
    "plugin_release_utils",
    "report_layout_filters",
    "semgrep_source_link_hardening",
    "semgrep_source_scanning",
    "source_content_comparison",
    "source_content_hardening",
    "trivy_source_scanning",
    "upstream_source_links",
]

[tool.setuptools.data-files]
"." = ["semgrep-rules.yml"]
