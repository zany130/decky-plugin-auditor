[project]
name = "decky-plugin-auditor"
version = "0.1.0"
description = "Static security auditing and reviewer evidence for Decky Loader plugins"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "urllib3",
    "PyYAML",
]

# The extracted baseline remains a script-based application while behavior
# parity with the original repository is validated. Packaging into an
# importable src/ layout will happen in a later, behavior-preserving change.
[tool.setuptools]
py-modules = []
